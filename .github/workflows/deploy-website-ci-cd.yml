name: Deploy Website CI/CD

on:
  push:
    branches:
      - trunk
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'

env:
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
  TF_VAR_domain_name: waldoibarra.com

jobs:
  lint-build-deploy:
    name: Lint, build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Lint Terraform, TypeScript, CSS files and commit message
        id: lint-files
        run: |
          npm run ci:lint
          tflint --chdir infrastructure
          npm run ci:lint:commit

      - name: Build app
        id: build-app
        run: npm run ci:build

      - name: Deploy infrastructure
        id: deploy-infrastructure
        working-directory: infrastructure
        run: |
          terraform init
          terraform plan -out tfplan
          terraform apply tfplan

      - name: Upload website artifacts to S3
        id: upload-artifacts
        run: |
          S3_BUCKET_ID=$(terraform -chdir=infrastructure output -raw s3_bucket_id)
          aws s3 sync ./dist "s3://$S3_BUCKET_ID" --delete

      - name: Invalidate CloudFront cache
        id: invalidate-cloudfront
        run: |
          DISTRIBUTION_ID=$(terraform -chdir=infrastructure output -raw cloudfront_distribution_id)
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed."
