name: Infrastructure CI/CD

on:
  push:
    branches: [trunk]
    paths:
      - 'infrastructure/**'
      - '.mise.toml'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  validate-and-apply:
    name: Validate, test and apply infrastructure
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_VAR_domain_name: waldoibarra.com
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: Cache Terraform providers
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      - run: just lint-tf
      - run: just lint-tf
      - run: just tf-init
      - run: just tf-test
      - run: just tf-plan-out
      - run: just tf-apply-auto
