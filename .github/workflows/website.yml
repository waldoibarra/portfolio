name: Website CI/CD

on:
  push:
    branches: [trunk]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'config/.stylelintrc.json'
      - '.mise.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # NOTE: Requires at least one successful infrastructure.yml run to populate
    # Terraform outputs (S3 bucket ID, CloudFront distribution ID). For initial
    # bootstrap, run infrastructure.yml manually via workflow_dispatch first.
    name: Build and deploy website
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          github_token: ${{ github.token }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - run: just install-node-deps
      - run: just lint
      - run: just build
      - run: just s3-sync
      - run: just invalidate
